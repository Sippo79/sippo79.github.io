<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>パスワード再設定 - PC Builds Hub</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="images/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#19e3ff" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NDQ8GTKGHC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-NDQ8GTKGHC');
  </script>

</head>
<body class="auth-page">
  <div class="page">
    <header class="top-header">
      <a href="./" class="site-logo">PC <span>Builds</span> Hub</a>
      <div class="nav-actions">
        <a href="./" class="btn">トップへ戻る</a>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="forgotTitle">
        <h1 id="forgotTitle" class="auth-title">パスワード再設定</h1>
        <p class="auth-lead" id="forgotLead">
          ご登録のメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。
        </p>

        <div class="auth-message" id="forgotMessage" role="status" hidden></div>

        <form id="forgotForm" class="auth-form" autocomplete="on" novalidate>
          <div class="auth-field">
            <label for="email">メールアドレス</label>
            <input id="email" name="email" type="email" autocomplete="email"
              placeholder="you@example.com" required />
          </div>

          <div class="auth-actions-row">
            <button type="submit" class="btn btn-primary" id="sendBtn">再設定メールを送信</button>
          </div>
        </form>

        <p class="auth-foot">
          <a href="login.html" class="auth-link">← ログイン画面へ戻る</a>
        </p>
      </section>
    </main>

    <footer class="page-footer">
      &copy; 2026 PC Builds Hub. All rights reserved.
    </footer>
  </div>

  <!-- Supabase（任意）: config はダミー値の間 Auth は無効。詳細は SETUP_SUPABASE.md -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="forgot-password.js"></script>
  <script src="sw-register.js"></script>
</body>
</html>
