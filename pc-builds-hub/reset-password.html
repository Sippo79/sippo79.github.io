<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>新しいパスワードの設定 - PC Builds Hub</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="images/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#19e3ff" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NDQ8GTKGHC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-NDQ8GTKGHC');
  </script>

</head>
<body class="auth-page">
  <div class="page">
    <header class="top-header">
      <a href="./" class="site-logo">PC <span>Builds</span> Hub</a>
      <div class="nav-actions">
        <a href="./" class="btn">トップへ戻る</a>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="resetTitle">
        <h1 id="resetTitle" class="auth-title">新しいパスワードの設定</h1>
        <p class="auth-lead" id="resetLead">
          リンクを確認しています…
        </p>

        <div class="auth-message" id="resetMessage" role="status" hidden></div>

        <!-- リンクの確認が取れたときだけ reset-password.js が表示する -->
        <form id="resetForm" class="auth-form" autocomplete="on" novalidate hidden>
          <div class="auth-field">
            <label for="newPassword">新しいパスワード</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password"
              placeholder="6文字以上" required minlength="6" />
          </div>

          <div class="auth-field">
            <label for="confirmPassword">新しいパスワード（確認）</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
              placeholder="もう一度入力してください" required minlength="6" />
          </div>

          <div class="auth-actions-row">
            <button type="submit" class="btn btn-primary" id="updateBtn">パスワードを変更</button>
          </div>
        </form>

        <!-- リンクが無効 / 期限切れのときに表示する導線 -->
        <p class="auth-foot" id="retryRow" hidden>
          <a href="forgot-password.html" class="auth-link">← 再設定メールを送り直す</a>
        </p>

        <!-- 変更完了後に表示する導線 -->
        <p class="auth-foot" id="toLoginRow" hidden>
          <a href="login.html" class="btn btn-primary" id="toLoginBtn">ログイン画面へ</a>
        </p>
      </section>
    </main>

    <footer class="page-footer">
      &copy; 2026 PC Builds Hub. All rights reserved.
    </footer>
  </div>

  <!-- Supabase（任意）: config はダミー値の間 Auth は無効。詳細は SETUP_SUPABASE.md -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="reset-password.js"></script>
  <script src="sw-register.js"></script>
</body>
</html>
