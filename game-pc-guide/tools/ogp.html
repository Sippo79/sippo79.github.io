<!DOCTYPE html>
<!--
  GAME PC GUIDE の OGP 画像（images/ogp.jpg）の元データ。2026-10-18 作成。
  外部の画像・ロゴ・素材は一切使わず、文字（OS標準フォント）と CSS / SVG の幾何学図形だけで描いている。
  作り直すときは、このファイルをブラウザで 1200×630 の表示領域で開き、JPEG で書き出して images/ogp.jpg に上書きする。
-->
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>GAME PC GUIDE OGP</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    color: #e8eefb;
    background:
      radial-gradient(700px 420px at 92% 10%, rgba(56, 189, 248, 0.22), transparent 70%),
      radial-gradient(520px 360px at 0% 100%, rgba(45, 212, 191, 0.14), transparent 70%),
      linear-gradient(160deg, #0e1628, #0b1120 60%);
  }
  /* 方眼 */
  .grid {
    position: absolute; inset: 0;
    background:
      linear-gradient(rgba(148, 163, 184, 0.07) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(148, 163, 184, 0.07) 1px, transparent 1px) 0 0 / 40px 40px;
    mask-image: linear-gradient(90deg, transparent, #000 45%);
  }
  .shapes { position: absolute; right: -40px; top: 50%; transform: translateY(-50%); width: 560px; height: 560px; }
  .content { position: absolute; left: 80px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .badge {
    align-self: flex-start;
    padding: 8px 18px; border-radius: 999px;
    font-size: 24px; font-weight: 700; letter-spacing: 0.04em;
    color: #2dd4bf; background: rgba(45, 212, 191, 0.12); border: 2px solid rgba(45, 212, 191, 0.35);
  }
  h1 { font-size: 112px; font-weight: 900; line-height: 1; letter-spacing: 0.02em; }
  h1 span { color: #38bdf8; }
  .sub { font-size: 38px; font-weight: 700; color: #b8c4da; }
  .points { display: flex; gap: 14px; margin-top: 6px; }
  .points li {
    list-style: none; padding: 10px 18px; border-radius: 12px;
    font-size: 24px; font-weight: 700; color: #e8eefb;
    background: rgba(18, 27, 46, 0.85); border: 2px solid rgba(148, 163, 184, 0.28);
  }
  .brand { position: absolute; left: 80px; bottom: 40px; font-size: 22px; font-weight: 700; color: #93a1bb; letter-spacing: 0.08em; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, #2dd4bf, #38bdf8); }
</style>
</head>
<body>
  <div class="grid"></div>
  <!-- 自作の幾何学模様（同心円・六角形・照準線） -->
  <svg class="shapes" viewBox="0 0 560 560" fill="none" stroke-linecap="round">
    <g stroke="#38bdf8">
      <circle cx="280" cy="280" r="250" stroke-opacity="0.18" stroke-width="2" />
      <circle cx="280" cy="280" r="190" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="6 12" />
      <circle cx="280" cy="280" r="120" stroke-opacity="0.5" stroke-width="4" />
      <circle cx="280" cy="280" r="18" stroke-opacity="0.9" stroke-width="5" />
      <path d="M280 20v120M280 420v120M20 280h120M420 280h120" stroke-opacity="0.45" stroke-width="4" />
    </g>
    <g stroke="#2dd4bf" stroke-width="3" stroke-opacity="0.55">
      <path d="M280 130 410 205v150L280 430 150 355V205z" />
      <path d="M150 205 280 280 410 205M280 280v150" stroke-opacity="0.3" />
    </g>
  </svg>
  <div class="content">
    <p class="badge">ゲーム別おすすめゲーミングPC</p>
    <h1>GAME PC <span>GUIDE</span></h1>
    <p class="sub">遊びたいゲームから、必要なPCがわかる</p>
    <ul class="points"><li>公式スペック</li><li>おすすめ構成</li><li>予算の目安</li></ul>
  </div>
  <p class="brand">SIPPO ／ sippo-pc.jp</p>
  <div class="bar"></div>
</body>
</html>
